<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakunawa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* just for this page: centre everything and stack the two buttons */
    .launcher {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 20px;
      text-align: center;
    }
    .launcher .choices {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px;
    }
    .launcher a.btn {
      display: inline-block;
      min-width: 300px;          /* both buttons the same size */
      text-decoration: none;
    }
  </style>
</head>
<body>

  <main class="launcher">
    <div>
      <p class="eyebrow">Choose this screen</p>
      <h1 class="title small">Bakunawa</h1>
    </div>

    <div class="choices">
      <a class="btn btn-reading" href="questions.html">Questions</a>
      <a class="btn btn-reading" href="story.html">Story</a>
    </div>

    <p class="hint">Open the story on the big screen and the questions on the small one, in the same browser.</p>
  </main>

</body>
</html>
